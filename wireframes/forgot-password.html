<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wireframe - Recuperar Contraseña | StudentTicket</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="w-16 h-16 rounded-xl bg-blue-600 mx-auto mb-4 flex items-center justify-center">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"></path></svg>
      </div>
      <h1 class="text-2xl font-bold text-slate-900">StudentTicket</h1>
    </div>

    <div class="bg-white rounded-2xl shadow-lg border border-slate-200 p-8">
      <h2 class="text-xl font-semibold text-slate-900 mb-2">Recuperar Contraseña</h2>
      <p class="text-sm text-slate-500 mb-6">Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.</p>

      <form class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Correo electrónico</label>
          <input type="email" placeholder="estudiante@universidad.edu" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition-colors">
          Enviar Enlace
        </button>
      </form>

      <div class="mt-6 text-center text-sm text-slate-500">
        <a href="login.html" class="text-blue-600 hover:text-blue-700 font-medium">← Volver al inicio de sesión</a>
      </div>
    </div>

    <p class="text-center text-xs text-slate-400 mt-8">© 2025 StudentTicket. Todos los derechos reservados.</p>
  </div>

</body>
</html>
