<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wireframe - Login | StudentTicket</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .wireframe-box { border: 2px dashed #94A3B8; background: #F1F5F9; }
    .placeholder-img { background: #CBD5E1; display: flex; align-items: center; justify-content: center; color: #64748B; }
  </style>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="w-16 h-16 rounded-xl bg-blue-600 mx-auto mb-4 flex items-center justify-center">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"></path></svg>
      </div>
      <h1 class="text-2xl font-bold text-slate-900">StudentTicket</h1>
      <p class="text-slate-500 text-sm mt-1">Plataforma de gestión de tickets estudiantiles</p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-lg border border-slate-200 p-8">
      <h2 class="text-xl font-semibold text-slate-900 mb-6">Iniciar Sesión</h2>

      <form class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Correo electrónico</label>
          <input type="email" placeholder="estudiante@universidad.edu" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
          <input type="password" placeholder="••••••••" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
        </div>

        <div class="flex items-center justify-between text-sm">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500">
            <span class="text-slate-600">Recordarme</span>
          </label>
          <a href="#" class="text-blue-600 hover:text-blue-700 font-medium">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition-colors">
          Iniciar Sesión
        </button>
      </form>

      <div class="mt-6 text-center text-sm text-slate-500">
        ¿No tienes una cuenta? 
        <a href="register.html" class="text-blue-600 hover:text-blue-700 font-medium">Regístrate aquí</a>
      </div>
    </div>

    <!-- Footer -->
    <p class="text-center text-xs text-slate-400 mt-8">
      © 2025 StudentTicket. Todos los derechos reservados.
    </p>
  </div>

</body>
</html>
