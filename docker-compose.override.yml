# ===========================================
# Docker Compose Override - Desarrollo Local
# Sobrescribe configuración para modo dev
# ===========================================

version: "3.9"

services:
  backend:
    build:
      target: builder
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: ["npm", "run", "dev"]

  frontend:
    build:
      target: builder
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - /app/build
    command: ["flutter", "run", "-d", "web-server", "--web-port", "8080", "--web-hostname", "0.0.0.0"]
