version: '3.8'

services:
  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
    container_name: student-tickets-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017/student_tickets
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=7d
      - BCRYPT_SALT_ROUNDS=12
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=100
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - LOG_LEVEL=info
    depends_on:
      - mongo
    networks:
      - student-tickets-network
    volumes:
      - api-logs:/app/logs

  mongo:
    image: mongo:7-jammy
    container_name: student-tickets-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=student_tickets
    volumes:
      - mongo-data:/data/db
    networks:
      - student-tickets-network

  # Redis para caché y sesiones (opcional, preparado para futuro)
  # redis:
  #   image: redis:7-alpine
  #   container_name: student-tickets-redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   networks:
  #     - student-tickets-network

volumes:
  mongo-data:
  api-logs:

networks:
  student-tickets-network:
    driver: bridge
