# ===========================================
# Docker Compose Override - Staging
# ===========================================

version: "3.9"

services:
  backend:
    image: ghcr.io/zumberr/app-ticket-master-frontend:staging-latest
    environment:
      NODE_ENV: staging
      LOG_LEVEL: info
      CORS_ORIGIN: https://staging.tickets.sanadatech.com
      RATE_LIMIT_MAX_REQUESTS: 200

  nginx:
    profiles:
      - default
    ports:
      - "80:80"
